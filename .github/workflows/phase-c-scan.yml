name: Phase C — Native Fixed-Point Verification

on:
  push:
    branches: [feature/*, master]
  pull_request:
    branches: [feature/*, master]

jobs:
  native-fixed-point:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 🔗 Verify native fixed-point (stages 2-4)
        run: bash scripts/verify-fixed-point.sh

      - name: ✨ Summary
        if: success()
        run: |
          echo "✅ Native fixed-point verification complete"
          echo "✓ Stages 2, 3, and 4 matched"
