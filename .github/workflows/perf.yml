name: T24 Paired Self-Compile Measurement

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout baseline
        uses: actions/checkout@v4
        with:
          ref: cfcd07f614af0d4b1bb763cc305e929d3171788e
          path: before
          persist-credentials: false
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: after
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: before/package-lock.json
      - name: Build both compilers outside the timed sections
        shell: bash
        run: |
          set -euo pipefail
          cmp before/package-lock.json after/package-lock.json
          cmp before/self/all.fl after/self/all.fl
          for variant in before after; do
            (cd "$variant" && npm ci --prefer-offline && npm run build)
          done
      - name: Measure alternating baseline and candidate on this runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p perf-results
          {
            printf 'baseline_commit=%s\n' "$(git -C before rev-parse HEAD)"
            printf 'candidate_commit=%s\n' "$(git -C after rev-parse HEAD)"
            printf 'node=%s\n' "$(node --version)"
            printf 'arch=%s\n' "$(uname -m)"
            printf 'cpus=%s\n' "$(nproc)"
            lscpu | awk -F: '/Model name/ {sub(/^[[:space:]]+/, "", $2); print "cpu_model=" $2}'
            printf 'order=before,after,before,after,before,after\n'
          } > perf-results/environment.txt
          printf 'variant\trun\telapsed_seconds\tmax_rss_kib\tsha256\n' > perf-results/measurements.tsv
          reference_output=''
          output_equal=yes
          for iteration in 1 2 3; do
            for variant in before after; do
              output_file="$RUNNER_TEMP/t24-$variant-$iteration.js"
              time_file="$RUNNER_TEMP/t24-$variant-$iteration.time"
              (
                cd "$variant"
                /usr/bin/time -f '%e\t%M' -o "$time_file" \
                  node --stack-size=65536 bootstrap.js run self/all.fl self/all.fl "$output_file" \
                  > "$RUNNER_TEMP/t24-$variant-$iteration.log" 2>&1
              )
              test -s "$output_file"
              read -r elapsed max_rss < "$time_file"
              output_sha=$(sha256sum "$output_file" | cut -d ' ' -f 1)
              printf '%s\t%s\t%s\t%s\t%s\n' "$variant" "$iteration" "$elapsed" "$max_rss" "$output_sha" \
                | tee -a perf-results/measurements.tsv
              if [ -z "$reference_output" ]; then
                reference_output="$output_file"
              elif ! cmp -s "$reference_output" "$output_file"; then
                output_equal=no
              fi
            done
          done
          printf 'output_equal=%s\n' "$output_equal" | tee perf-results/equality.txt
          test "$output_equal" = yes
      - name: Upload paired measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t24-measurements
          path: perf-results/
          retention-days: 30
