name: Phase C — Full Integration (Native Fixed-Point + Jest + Slack)

# Optional full suite and Slack notifications; run manually to avoid duplicate CI.
on:
  workflow_dispatch:

env:
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  SLACK_CHANNEL: '#freelang-ci'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # Phase 1: Fast Checks (Early-Fail) + Slack Notify
  # ═══════════════════════════════════════════════════════════════════
  scan-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      fixedpoint-status: ${{ steps.verify.outcome }}
      verify-status: ${{ steps.verify.outcome }}
      ci-status: ${{ steps.aggregate.outcome }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build bootstrap for the legacy regression suite
        run: npm run build
        timeout-minutes: 5

      - name: "🔗 Native Fixed-Point Verification (stages 2-4)"
        id: verify
        if: always()
        run: bash scripts/ci-run-check.sh --name verify --output-dir ci-results --timeout-seconds 600 -- bash scripts/verify-fixed-point.sh

      - name: "🧪 Let-in-Expression Regression"
        id: regression
        if: always()
        run: bash scripts/ci-run-check.sh --name regression --output-dir ci-results --timeout-seconds 600 -- node scripts/check-let-regressions.js

      - name: "🔐 Validate verification results"
        id: aggregate
        if: always()
        run: node scripts/ci-aggregate.js --root . --expected verify,regression

      - name: "📦 Upload verification artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-artifacts-${{ github.run_id }}
          path: |
            ci-results/
          retention-days: 7

      - name: "🚨 Slack Notify — Fixed-Point Failed"
        if: env.SLACK_WEBHOOK_URL != '' && steps.verify.outcome == 'failure'
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "channel": "${{ env.SLACK_CHANNEL }}",
              "icon_emoji": ":x:",
              "text": "❌ Phase C — Native Fixed-Point Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*❌ Native fixed-point verification failed*\n_Branch:_ `${{ github.ref_name }}`\n_Run:_ <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs>"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Action Required:*\n1. Check the native fixed-point log artifact\n2. Review the stage hashes and compiler output\n3. Re-submit PR"
                  }
                }
              ]
            }

      - name: "✅ Slack Notify — Fixed-Point Passed"
        if: env.SLACK_WEBHOOK_URL != '' && steps.aggregate.outcome == 'success'
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "channel": "${{ env.SLACK_CHANNEL }}",
              "icon_emoji": ":white_check_mark:",
              "text": "✅ Phase C — Native Fixed-Point Passed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*✅ Native Fixed-Point Status*\n_Branch:_ `${{ github.ref_name }}`"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Results:*\n• Fixed-point: ${{ steps.verify.outcome == 'success' && '✅ PASS' || '⚠️ WARN' }}\n• Regression: ${{ steps.regression.outcome == 'success' && '✅ PASS' || '⚠️ WARN' }}\n\n_Next: Regression tests + Full Jest..._"
                  }
                }
              ]
            }

  # ═══════════════════════════════════════════════════════════════════
  # Phase 2: Regression Tests (Fast)
  # ═══════════════════════════════════════════════════════════════════
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: scan-and-verify
    if: ${{ needs.scan-and-verify.outputs.fixedpoint-status == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build runtime for tests
        run: npm run build

      - name: "🧪 Jest Regression Tests (Codegen + Let)"
        id: regression
        run: bash scripts/ci-run-check.sh --name regression-tests --output-dir ci-results --timeout-seconds 270 --source-json ci-results/regression-tests-source.json -- npm test -- src/__tests__/codegen.let.test.ts --silent --json --outputFile=ci-results/regression-tests-source.json
        timeout-minutes: 5

      - name: "🔐 Validate regression result"
        if: always()
        run: node scripts/ci-aggregate.js --root . --expected regression-tests

      - name: "📦 Upload regression evidence"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results-${{ github.run_id }}
          path: ci-results/
          retention-days: 7

      - name: "✅ Regression Tests PASS"
        if: steps.regression.outcome == 'success'
        run: echo "✅ All regression tests passed"

  # ═══════════════════════════════════════════════════════════════════
  # Phase 3: Full Jest (Matrix/Sharded)
  # ═══════════════════════════════════════════════════════════════════
  jest-full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: scan-and-verify
    if: ${{ needs.scan-and-verify.outputs.fixedpoint-status == 'success' }}

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build runtime for tests
        run: npm run build

      - name: "📊 Jest Shard ${{ matrix.shard }}/3"
        id: jest
        run: bash scripts/ci-run-check.sh --name jest-${{ matrix.shard }} --output-dir ci-results --timeout-seconds 1770 --source-json ci-results/jest-${{ matrix.shard }}-source.json -- npm test -- --shard=${{ matrix.shard }}/3 --bail=false --silent --maxWorkers=4 --json --outputFile=ci-results/jest-${{ matrix.shard }}-source.json
        timeout-minutes: 30

      - name: "🔐 Validate Jest result"
        if: always()
        run: node scripts/ci-aggregate.js --root . --expected jest-${{ matrix.shard }}

      - name: "📦 Upload Jest Results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-results-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            coverage/
            junit.xml
            ci-results/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════
  # Phase 4: Final Summary & Slack Notify
  # ═══════════════════════════════════════════════════════════════════
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [scan-and-verify, regression-tests, jest-full]
    if: always()

    outputs:
      overall-status: ${{ steps.summary.outputs.status }}

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts (summary)
        uses: actions/download-artifact@v4
        if: always()
        continue-on-error: true

      - name: "📊 Determine Overall Status"
        id: summary
        run: |
          set +e
          node scripts/ci-aggregate.js --root . --expected verify,regression,regression-tests,jest-1,jest-2,jest-3
          aggregate_status=$?
          if [ "$aggregate_status" -eq 0 ] && \
             [ "${{ needs.scan-and-verify.result }}" == "success" ] && \
             [ "${{ needs.regression-tests.result }}" == "success" ] && \
             [ "${{ needs.jest-full.result }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi

      - name: "🔐 Enforce product verification result"
        if: always()
        run: |
          if [ "${{ steps.summary.outputs.status }}" != "success" ]; then
            echo "Product verification failed; Slack notification status is independent."
            exit 1
          fi

      - name: "✅ Slack Notify — All Green"
        if: env.SLACK_WEBHOOK_URL != '' && steps.summary.outputs.status == 'success'
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "channel": "${{ env.SLACK_CHANNEL }}",
              "icon_emoji": ":rocket:",
              "text": "✨ Phase C — All Green (Ready to Merge)",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*✨ Phase C — All Checks PASSED*\n_Branch:_ `${{ github.ref_name }}`\n_Commit:_ `${{ github.sha }}`"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Phase Results:*\n• ✅ Scan & Verify: PASS\n• ✅ Regression: PASS\n• ✅ Jest (3 shards): PASS\n\n*Status:* 🟢 Ready for merge"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "<${{ github.server_url }}/${{ github.repository }}/pulls/${{ github.event.number }} | View PR> • <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} | View Run>"
                  }
                }
              ]
            }

      - name: "❌ Slack Notify — Failed"
        if: env.SLACK_WEBHOOK_URL != '' && steps.summary.outputs.status == 'failure'
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "channel": "${{ env.SLACK_CHANNEL }}",
              "icon_emoji": ":warning:",
              "text": "⚠️ Phase C — Check Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*⚠️ Phase C — Some Checks Failed*\n_Branch:_ `${{ github.ref_name }}`"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Failed Phase(s):*\n• Scan & Verify: ${{ needs.scan-and-verify.result }}\n• Regression: ${{ needs.regression-tests.result }}\n• Jest: ${{ needs.jest-full.result }}\n\n_Review logs and artifacts._"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} | 📋 View Detailed Logs>"
                  }
                }
              ]
            }

  # ═══════════════════════════════════════════════════════════════════
  # Nightly: Full Self-Hosting Chain
  # ═══════════════════════════════════════════════════════════════════
  nightly-self-host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Native Compiler Fixed-Point
        id: nightly
        run: bash scripts/verify-fixed-point.sh

      - name: "✅ Slack Notify — Nightly Success"
        if: env.SLACK_WEBHOOK_URL != '' && steps.nightly.outcome == 'success'
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "channel": "${{ env.SLACK_CHANNEL }}",
              "icon_emoji": ":moon:",
              "text": "🌙 Nightly Self-Hosting Verification — PASS",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*✅ Nightly Verification PASSED*\n_Time:_ $(date -u)\n_Branch:_ master"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Results:*\n• Build: ✅\n• Fixed-Point: ✅\n• Jest (643 tests): ✅"
                  }
                }
              ]
            }

      - name: "❌ Slack Notify — Nightly Failed"
        if: env.SLACK_WEBHOOK_URL != '' && steps.nightly.outcome == 'failure'
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "channel": "${{ env.SLACK_CHANNEL }}",
              "icon_emoji": ":rotating_light:",
              "text": "🌙 Nightly Self-Hosting Verification — FAILED",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*❌ Nightly Verification FAILED*\n_Time:_ $(date -u)\n_Action Required:_ Review logs immediately"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} | View Nightly Run>"
                  }
                }
              ]
            }
